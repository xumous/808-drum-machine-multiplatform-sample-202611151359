<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8"/>
    <title>808 · SYNTHETIC DRUM MACHINE</title>
    <link href="style.css" rel="stylesheet"/>
</head>
<body>
<div id="stage">
    <canvas height="720" id="panel" width="1280"></canvas>
</div>

<!-- SONG CHAIN EDITOR（对应 Qt 版 QDialog） -->
<div class="modal hidden" id="songModal">
    <div class="modal-box">
        <div class="modal-title">SONG CHAIN EDITOR</div>
        <div class="song-list" id="songList"></div>
        <div class="song-grid">
            <button data-cmd="0">+ ADD</button>
            <button data-cmd="1">- DEL</button>
            <button data-cmd="2">UP</button>
            <button data-cmd="3">DOWN</button>
            <button data-cmd="4">PAT -</button>
            <button data-cmd="5">PAT +</button>
            <button data-cmd="6">REP -</button>
            <button data-cmd="7">REP +</button>
        </div>
        <div class="song-actions">
            <button class="primary" id="songApply">APPLY &amp; CLOSE</button>
            <button id="songCancel">CANCEL</button>
        </div>
    </div>
</div>

<script src="wasi.js"></script>
<script src="engine.js"></script>
<script src="renderer.js"></script>
</body>
</html>
